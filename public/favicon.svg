<!-- Brand logo: Syahfalah monogram -->
<!-- 3-pillar system: Blue (trust) + Aurum (warmth) + Verdigris (growth) -->
<!-- Geometric S with cascade pattern — premium feel without decorative slop -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Syahfalah">
  <defs>
    <linearGradient id="brand-blue" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="oklch(0.55 0.20 260)"/>
      <stop offset="100%" stop-color="oklch(0.38 0.18 260)"/>
    </linearGradient>
    <linearGradient id="brand-aurum" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="oklch(0.78 0.15 75)"/>
      <stop offset="100%" stop-color="oklch(0.62 0.16 75)"/>
    </linearGradient>
    <linearGradient id="brand-verdigris" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="oklch(0.65 0.13 175)"/>
      <stop offset="100%" stop-color="oklch(0.50 0.12 175)"/>
    </linearGradient>
  </defs>

  <!-- Base plate -->
  <rect width="64" height="64" rx="16" fill="url(#brand-blue)"/>

  <!-- Cascade ribbons — 3 pillars (Blue + Aurum + Verdigris) -->
  <path d="M0 38 L64 38 L64 40 L0 40 Z" fill="url(#brand-aurum)" opacity="0.95"/>
  <path d="M0 50 L64 50 L64 51 L0 51 Z" fill="url(#brand-verdigris)" opacity="0.85"/>

  <!-- Geometric S — three arcs that overlap -->
  <path d="M44 22 Q44 14 32 14 Q20 14 20 22 Q20 30 32 30 Q44 30 44 38 Q44 50 32 50 Q20 50 20 42"
        stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
